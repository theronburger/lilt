name: Bug report
description: Something in Lilt did not work
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include steps to reproduce and what you expected. Do not include API keys or private captures.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Lilt and macOS versions
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional details
