version: 2
updates:
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      swift:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /Speech
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      speech:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]
