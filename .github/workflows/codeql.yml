name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            runner: macos-26
            build-mode: manual
          - language: python
            runner: ubuntu-24.04
            build-mode: none
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Swift toolchain and dependencies
        if: matrix.language == 'swift'
        timeout-minutes: 5
        run: |
          sw_vers
          uname -m
          xcode-select -p
          xcodebuild -version
          xcrun --find swift
          swift --version
          swift package resolve
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build Swift for analysis
        if: matrix.language == 'swift'
        timeout-minutes: 30
        # The macOS tracer relocates toolchain binaries before compilation. This
        # can be silent for several minutes: github/codeql#22275.
        run: swift build --arch arm64 --verbose
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
